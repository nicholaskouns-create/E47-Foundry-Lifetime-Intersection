name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python/REQUIREMENTS.txt
      - run: python python/spectral_engine.py
      - run: python python/data_lifetime_algebra.py
      - run: python python/intersectionality_validator.py
